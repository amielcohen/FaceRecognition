services:

  backend:
    build: .
    container_name: face-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app                                  # live reload during development
      - ./employees_data:/app/employees_data
      - ./storage:/app/storage
      - ./database:/app/database
      - ./data:/app/data
      - ./models:/app/models
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PYTHONUNBUFFERED=1
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - CAMERA_SOURCE=${CAMERA_SOURCE:-0}       # override in .env if needed
      - TZ=Asia/Jerusalem
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: face-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
